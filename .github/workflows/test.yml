name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check build output
        run: node -e "const { existsSync } = require('node:fs'); if (!existsSync('dist')) throw new Error('Build failed - dist directory not found');"

      - name: Verify package exports and artifacts
        run: npm run verify:package

      - name: Verify benchmark sources
        run: npm run verify:benchmarks

      - name: Verify packed artifact in an empty consumer
        run: npm run verify:packed

  packed-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify packed artifact in Chromium
        run: npm run verify:browser
