name: Release evidence

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install exact dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Verify runnable examples
        run: npm run verify:examples

      - name: Verify package contract
        run: npm run verify:package

      - name: Verify benchmark sources
        run: npm run verify:benchmarks

      - name: Verify a packed empty consumer
        run: npm run verify:packed

  artifact:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact release candidate and evidence
        run: npm run release:candidate -- --require-tag

      - name: Upload exact tarball and external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fise-${{ github.ref_name }}-release-evidence
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
